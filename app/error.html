<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Menyu</title>
<style>
  body { margin: 0; background: #0D0B0A; color: #F5EFE6; font: 17px/1.5 system-ui, Roboto, sans-serif; }
  .w { max-width: 560px; margin: 0 auto; padding: 48px 20px; text-align: center; }
  .logo { width: 72px; height: 72px; margin: 0 auto 14px; border: 2px solid #D6B370; border-radius: 50%; color: #D6B370; font: 700 38px/68px Georgia, serif; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #A69C91; margin: 0 0 16px; }
  .i { text-align: left; background: #1A1613; border-radius: 12px; padding: 12px; font: 13px/1.45 monospace; color: #F2B8A8; word-break: break-word; }
  button { display: block; width: 100%; margin: 14px 0 0; padding: 18px; border: 0; border-radius: 14px; font: 700 19px system-ui, sans-serif; background: #D6B370; color: #1A140C; }
</style>
</head>
<body>
<div class="w">
  <div class="logo">M</div>
  <h1>Serverga ulanib bo'lmadi</h1>
  <p>Planshet internetga ulanganini tekshiring (Wi-Fi yoki mobil internet) va "Qayta urinish" ni bosing.</p>
  <div class="i" id="i"></div>
  <button id="r">Qayta urinish</button>
</div>
<script>
  // Ilova saytni ocha olmasa (internet yo'q yoki sayt javob bermadi) shu sahifa chiqadi
  var ua = navigator.userAgent;
  var c = (ua.match(/Chrome\/(\d+)/) || [])[1] || "?";
  var a = (ua.match(/Android ([\d.]+)/) || [])[1] || "?";
  var txt = "Android " + a + ", WebView Chrome " + c + (navigator.onLine === false ? ", internet yo'q" : "");
  if (c !== "?" && +c < 55) txt += "\nWebView juda eski: Play Market'dan \"Android System WebView\" ni yangilang.";
  document.getElementById("i").textContent = txt;
  document.getElementById("r").onclick = function () { location.href = "https://kamoliddinraxmatov.github.io/Smart-Menyu/index.html"; };
</script>
</body>
</html>
