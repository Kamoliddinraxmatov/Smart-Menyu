# Har safar main'ga yangi kod tushganda ikki Android ilovani (APK) yig'adi va Releases bo'limiga qo'yadi:
#   SmartMenyu.apk       restoran planshetlari uchun (ofitsiant, oshxona, boshqaruv)
#   SmartMenyuEgasi.apk  faqat egasi uchun (restoranlarga obuna berish, planshetlarni tasdiqlash)
#   SmartMenyuAgent.apk  sotuv agentlari uchun (yo'qotish kalkulyatori, internetsiz ishlaydi)
# Doimiy havolalar:
# https://github.com/Kamoliddinraxmatov/Smart-Menyu/releases/latest/download/SmartMenyu.apk
# https://github.com/Kamoliddinraxmatov/Smart-Menyu/releases/latest/download/SmartMenyuEgasi.apk
# https://github.com/Kamoliddinraxmatov/Smart-Menyu/releases/latest/download/SmartMenyuAgent.apk
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Eski planshetlar uchun nusxa yangi ekanini tekshirish
        run: |
          npm i --no-save --no-audit --no-fund esbuild@0.24.0
          node tools/build-legacy.mjs
          git diff --exit-code -- js/legacy css/legacy vendor/legacy || { echo "js/ o'zgargan: node tools/build-legacy.mjs ni ishga tushirib, natijani commit qiling"; exit 1; }

      - name: Veb fayllarni ilovaga ko'chirish
        run: |
          mkdir -p app/www
          cp -r index.html waiter.html kitchen.html admin.html manifest.webmanifest css js img vendor app/www/
          # Sayt ochilmasa ilova ichida ko'rinadigan sahifa (qora ekran o'rniga)
          cp app/error.html app/www/error.html
          # Egasi ilovasi restoran planshetiga kirmaydi
          rm -f app/www/js/owner.js app/www/css/owner.css
          # Planshetga faqat egasining ochiq kaliti kerak: shifrlangan maxfiy kalit olib tashlanadi
          node -e "import('./js/owner-key.js').then(({OWNER:o})=>require('fs').writeFileSync('app/www/js/owner-key.js','export const OWNER = '+JSON.stringify({pub:o.pub})+';\n'))"
          mkdir -p app-owner/www
          cp -r css js img vendor app-owner/www/
          cp owner.html app-owner/www/index.html
          # Agent ilovasi saytga bog'liq emas: hamma fayl ilova ichida, internetsiz ochiladi
          mkdir -p app-agent/www
          cp agent/index.html agent/manifest.webmanifest agent/logo-192.png agent/logo-512.png app-agent/www/

      - name: Capacitor o'rnatish
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx cap add android

      - name: Ikonka va splash
        working-directory: app
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0D0B0A' --iconBackgroundColorDark '#0D0B0A' --splashBackgroundColor '#0D0B0A' --splashBackgroundColorDark '#0D0B0A'

      - name: Sinxronlash
        working-directory: app
        run: npx cap sync android

      - name: Oshxona xizmati (ekran o'chiq bo'lsa ham yangi buyurtmada signal va ekran yonadi)
        run: python3 tools/patch-android.py app/android

      - name: Egasi ilovasini tayyorlash
        working-directory: app-owner
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0D0B0A' --iconBackgroundColorDark '#0D0B0A' --splashBackgroundColor '#0D0B0A' --splashBackgroundColorDark '#0D0B0A' || true
          npx cap sync android

      - name: Agent ilovasini tayyorlash
        working-directory: app-agent
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0D0B0A' --iconBackgroundColorDark '#0D0B0A' --splashBackgroundColor '#0D0B0A' --splashBackgroundColorDark '#0D0B0A' || true
          npx cap sync android

      - name: Himoya (debug va zaxira nusxa o'chiriladi)
        run: |
          for d in app app-owner app-agent; do
            m=$d/android/app/src/main/AndroidManifest.xml
            sed -i 's/android:allowBackup="true"/android:allowBackup="false" android:fullBackupContent="false"/' $m
            grep -q 'allowBackup="false"' $m
            sed -i 's/buildTypes {/buildTypes {\n        debug { debuggable false }/' $d/android/app/build.gradle
            grep -q 'debuggable false' $d/android/app/build.gradle
          done


      - name: Doimiy imzo (yangi versiya eskisining ustidan o'rnatiladi, planshet qayta tasdiqlanmaydi)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::SIGNING_KEY sozlanmagan: APK tasodifiy imzo bilan chiqadi va eskisining ustidan o'rnatilmaydi"
            exit 0
          fi
          k="$RUNNER_TEMP/sm.keystore"
          printf '%s' "$SIGNING_KEY" | tr -d ' \r\n' | base64 -d > "$k"
          keytool -list -v -keystore "$k" -storepass android | grep "SHA256:"
          echo "SM_KEYSTORE=$k" >> "$GITHUB_ENV"
          for d in app app-owner app-agent; do
            python3 - "$d/android/app/build.gradle" "$k" <<'PY'
          import sys
          p, k = sys.argv[1], sys.argv[2]
          g = open(p).read()
          block = 'signingConfigs { fixed { storeFile file("%s"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }\n    buildTypes {' % k
          g = g.replace("buildTypes {", block, 1)
          g = g.replace("debug { debuggable false }", "debug { debuggable false; signingConfig signingConfigs.fixed }", 1)
          assert "signingConfig signingConfigs.fixed" in g
          open(p, "w").write(g)
          PY
          done

      - name: APK yig'ish
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../SmartMenyu.apk

      - name: Egasi ilovasi
        working-directory: app-owner/android
        run: |
          chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../SmartMenyuEgasi.apk

      - name: Agent ilovasi
        working-directory: app-agent/android
        run: |
          chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../SmartMenyuAgent.apk

      - name: Imzoni tekshirish
        if: env.SM_KEYSTORE != ''
        run: |
          want=$(keytool -list -v -keystore "$SM_KEYSTORE" -storepass android | grep "SHA256:" | head -1 | awk '{print $2}')
          for f in SmartMenyu.apk SmartMenyuEgasi.apk SmartMenyuAgent.apk; do
            got=$(keytool -printcert -jarfile $f | grep "SHA256:" | head -1 | awk '{print $2}')
            echo "$f: $got"
            [ "$got" = "$want" ] || { echo "::error::$f doimiy kalit bilan imzolanmadi"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: SmartMenyu-apk
          path: |
            SmartMenyu.apk
            SmartMenyuEgasi.apk
            SmartMenyuAgent.apk

      - name: Release'ga qo'yish
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Smart Menyu 1.0.${{ github.run_number }}
          body: "SmartMenyu.apk: restoran planshetlari uchun. SmartMenyuEgasi.apk: faqat egasi uchun. SmartMenyuAgent.apk: sotuv agentlari uchun kalkulyator. Yuklab oling va o'rnating (noma'lum manbalardan o'rnatishga ruxsat bering)."
          files: |
            SmartMenyu.apk
            SmartMenyuEgasi.apk
            SmartMenyuAgent.apk
          make_latest: true
