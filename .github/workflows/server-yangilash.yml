# Serverni kompyutersiz yangilash: main'ga yangi kod tushganda (PR merge qilinganda) GitHub o'zi serverga ulanib,
# kodni oladi va ofisni qayta quradi. Qo'lda ham: Actions -> "Serverni yangilash" -> Run workflow.
# Kerakli sirlar (Settings -> Secrets and variables -> Actions): SERVER_HOST (server manzili), SERVER_PASSWORD (root paroli).
# Sirlar qo'yilmagan bo'lsa ish o'tkazib yuboriladi, xato bermaydi.
name: Serverni yangilash

on:
  push:
    branches: [main]
    paths: ["server/**"]
  workflow_dispatch:

concurrency:
  group: server-yangilash
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sirlar bormi
        id: check
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          if [ -n "$HOST" ] && [ -n "$PASS" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "SERVER_HOST yoki SERVER_PASSWORD siri yo'q: o'tkazib yuborildi"; fi

      - name: Serverda kodni olish va ofisni qayta qurish
        if: steps.check.outputs.ok == '1'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/Smart-Menyu 2>/dev/null || cd /root/Smart-Menyu
            git pull --ff-only
            cd server
            docker compose up -d --build
            sleep 8
            docker compose logs --tail 5 office | sed -E 's/bot[0-9]+:[A-Za-z0-9_-]+/bot***/g'
