# Claude Code: Issue yoki izohda "@claude" yozilsa, Claude shu repoda ishni bajaradi va javobini Issue'ga yozadi.
# Virtual ofis /claude buyrug'i vazifani shunday Issue qilib ochadi va javobni Telegramga yuboradi.
# Faqat repo egasi yozgan "@claude" ishga tushiradi (repo ochiq, begonalar Claude limitini sarflay olmaydi).
# Kerakli sir: Settings -> Secrets and variables -> Actions -> CLAUDE_CODE_OAUTH_TOKEN (Claude Code'da /install-github-app beradi).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      github.event.sender.login == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
