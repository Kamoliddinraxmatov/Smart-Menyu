# Smart Menyu o'z serveri: Mosquitto (MQTT) + Caddy (avtomatik HTTPS sertifikat) + Telegram botlar (Qayta tashrif) + AI ofis.
# Ishga tushirish: README.md ga qarang.
services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: always
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./passwd:/mosquitto/config/passwd
      - ./acl:/mosquitto/config/acl:ro
      - mqtt-data:/mosquitto/data
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
  bot:
    build:
      context: ..
      dockerfile: server/bot/Dockerfile
    restart: always
    depends_on:
      - mqtt
    environment:
      - MQTT_URL=${BOT_MQTT_URL:-ws://mqtt:9001}
      - MQTT_USER=smartmenyu
      - MQTT_PASS=${MQTT_PASS}
    volumes:
      - bot-data:/data
  office:
    build:
      context: ..
      dockerfile: server/office/Dockerfile
    restart: always
    env_file:
      - path: office.env
        required: false
    volumes:
      - office-data:/data
volumes:
  bot-data:
  office-data:
  mqtt-data:
  caddy-data:
